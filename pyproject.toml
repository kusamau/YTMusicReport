[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ytmusic-report"
version = "0.1.0"
description = "Retrieve displayed play counts from public YouTube Music playlists."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ytmusicapi>=1.12.3,<1.13",
]

[project.scripts]
ytmusic-report = "ytmusic_report.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: contacts YouTube Music; enabled only when YTMUSIC_LIVE_TEST=1",
]

[tool.setuptools.packages.find]
where = ["src"]
